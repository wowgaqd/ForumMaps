<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(26, 26, 26, 0.8)), #1a1a1a;
            color: #e0e0e0;
            font-family: 'Unbounded', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            background-color: rgba(36, 36, 36, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 100%;
            max-width: 350px; 
            padding: 30px 15px; 
            backdrop-filter: blur(15px);
        }

        .registration-title {
            font-size: 2.5rem;
            margin-bottom: 20px; 
            cursor: pointer;
            color: #ffffff;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-field {
            width: 90%;
            max-width: 250px;
            padding: 8px; 
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333;
            color: #e0e0e0;
            font-size: 0.8rem; 
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #ffffff;
            outline: none;
        }

        .input-field::placeholder {
            color: #aaa;
        }

        .error-message {
            color: red; 
            font-size: 0.8rem; 
            display: none; 
        }

        .login-button {
            width: 90%;
            max-width: 120px; 
            padding: 10px;
            background-color: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            font-size: 0.8rem; 
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            background-color: #e0e0e0;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #ffffff;
            border-radius: 3px;
            z-index: 1000;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>

    <div class="login-container">
        <div class="registration-title"><i class="fas fa-user"></i></div>
        <form class="login-form" id="loginForm" onsubmit="return validateForm(event)">
            <input type="text" placeholder="Имя пользователя" class="input-field" id="username" required autocomplete="username">
            <input type="password" placeholder="Пароль" class="input-field" id="password" required autocomplete="current-password">
            <div class="error-message" id="errorMessage">Вы ввели логин или пароль неверно</div>
            <div class="error-message" id="emptyFieldMessage">Пожалуйста, заполните все поля</div>
            <button type="submit" class="login-button" id="loginButton">Войти</button>
        </form>
    </div>

    <script>
        const validUsername = '@GirlFlap';
        const validPassword = 'QMeLhQvVUbjFSwI';

        window.onload = function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'base.html'; // Если пользователь уже авторизован, перенаправление на base.html
            }
        };

        function sendIpAddress(userIp, username) {
            const ipList = JSON.parse(localStorage.getItem('ipList')) || [];
            const entry = { ip: userIp, user: username };
            ipList.push(entry);
            localStorage.setItem('ipList', JSON.stringify(ipList));
        }

        function validateForm(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const emptyFieldMessage = document.getElementById('emptyFieldMessage');
            const progressBar = document.getElementById('progressBar');

            // Получение IP-адреса пользователя
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const userIp = data.ip;

                    if (!username || !password) {
                        emptyFieldMessage.style.display = 'block';
                        errorMessage.style.display = 'none';
                    } else if (username === validUsername && password === validPassword) {
                        localStorage.setItem('currentUser', username); // Сохранение текущего пользователя
                        sendIpAddress(userIp, username); // Отправка IP и имени пользователя
                        emptyFieldMessage.style.display = 'none';
                        errorMessage.style.display = 'none';
                        
                        progressBar.style.width = '100%';

                        setTimeout(() => {
                            window.location.href = 'base.html';
                        }, 2500);
                    } else {
                        emptyFieldMessage.style.display = 'none';
                        errorMessage.style.display = 'block';
                    }
                })
                .catch(err => console.error('Ошибка получения IP:', err));
        }
    </script>
</body>
</html>
