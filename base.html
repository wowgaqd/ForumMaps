<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded&display=swap" rel="stylesheet">
    <title>База IP Адресов</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Unbounded', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            text-align: center;
            position: relative; /* Для позиционирования кнопки */
        }
        .ip-container {
            padding: 20px;
            background-color: rgba(36, 36, 36, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
            display: inline-block;
            margin-top: 100px;
            width: 350px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .ip-frame {
            border: 1px solid #888;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-button {
            background-color: #e74c3c;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .delete-button:hover {
            background-color: #c0392b;
        }
        .user-info {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .logout-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e74c3c;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
        }
        .logout-button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <button class="logout-button" onclick="logout()">Выйти</button>
    
    <div class="ip-container">
        <h1>IP Адреса</h1>
        <div class="user-info" id="userInfo"></div>
        <div id="ipList"></div>
    </div>

    <script>
        // Проверка на авторизацию при загрузке страницы
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'crime.html'; // Если не авторизован, перенаправление на crime.html
        }

        const ipList = JSON.parse(localStorage.getItem('ipList')) || [];
        document.getElementById('userInfo').textContent = `Вы авторизованы как: ${currentUser}`;

        // Вывод IP адресов с именами пользователей
        ipList.forEach(entry => {
            const ipDiv = document.createElement('div');
            ipDiv.className = 'ip-frame';
            ipDiv.textContent = `${entry.user} - ${entry.ip}`;

            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete-button';
            deleteButton.textContent = 'Удалить';
            deleteButton.onclick = function() {
                const index = ipList.indexOf(entry);
                ipList.splice(index, 1); // Удаление IP из массива
                localStorage.setItem('ipList', JSON.stringify(ipList)); // Обновление localStorage
                window.location.reload(); // Перезагрузка страницы
            };

            ipDiv.appendChild(deleteButton);
            document.getElementById('ipList').appendChild(ipDiv);
        });

        function logout() {
            localStorage.removeItem('currentUser'); // Удаление текущего пользователя
            window.location.href = 'crime.html'; // Переход на crime.html
        }
    </script>
</body>
</html>
